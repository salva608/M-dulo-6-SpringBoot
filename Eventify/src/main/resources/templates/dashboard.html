<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Administrativo - Eventify</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        h1 {
            color: #2c3e50;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 10px;
            margin-top: 0;
        }
        .btn-group {
            margin-bottom: 20px;
        }
        .btn {
            display: inline-block;
            background-color: #3498db;
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            transition: background-color 0.2s;
            margin-right: 10px;
            border: none;
            cursor: pointer;
        }
        .btn:hover {
            background-color: #2980b9;
        }
        .btn-secondary {
            background-color: #2ecc71;
        }
        .btn-secondary:hover {
            background-color: #27ae60;
        }
        .btn-dark {
            background-color: #34495e;
        }
        .btn-dark:hover {
            background-color: #2c3e50;
        }
        /* Estilos para la barra de filtrado */
        .filter-section {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            border: 1px solid #e0e0e0;
        }
        .filter-form {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .filter-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1em;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }
        th {
            background-color: #f8f9fa;
            color: #2c3e50;
            font-weight: 600;
        }
        tr:hover {
            background-color: #fcfcfc;
        }
        .alert-info {
            background-color: #e8f4fd;
            border-left: 4px solid #3498db;
            color: #2c3e50;
            padding: 15px;
            border-radius: 4px;
            margin-top: 15px;
            font-size: 1.05em;
        }
        .badge {
            background-color: #7f8c8d;
            color: white;
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 0.85em;
        }
        .badge-city {
            background-color: #e67e22;
        }
        /* Estilos de paginación */
        .pagination-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid #ecf0f1;
        }
        .pagination-btn {
            background-color: #34495e;
        }
        .pagination-btn.disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Panel de Administración - Eventify</h1>

    <div class="btn-group">
        <a th:href="@{/events/new}" class="btn">📝 Registrar Nuevo Evento</a>
    </div>

    <div class="filter-section">
        <form th:action="@{/events}" method="get" class="filter-form">
            <input type="text" name="city" th:value="${selectedCity}" class="filter-input" placeholder="Buscar por ciudad de la sede (Ej: Medellin, Bogota)...">
            <button type="submit" class="btn btn-dark">Buscar</button>
            <a th:href="@{/events}" class="btn" style="background-color: #95a5a6;">Limpiar</a>
        </form>
    </div>

    <div th:if="${events.isEmpty()}" class="alert-info">
        ℹ️ <strong>Actualmente no hay eventos programados en esta selección.</strong>
    </div>

    <div th:unless="${events.isEmpty()}">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Nombre del Evento</th>
                <th>Fecha</th>
                <th>Sede Física</th>
                <th>Ciudad</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="event : ${events}">
                <td><span class="badge" th:text="${event.id}">1</span></td>
                <td th:text="${event.eventName}" style="font-weight: 600; color: #2c3e50;">Concierto de Arcangel</td>
                <td th:text="${event.date}">15/05/2026</td>
                <td th:text="${event.venueName}">Movistar Arena</td>
                <td><span class="badge badge-city" th:text="${event.city}">Bogota</span></td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="pagination-container">
        <span style="color: #7f8c8d; font-weight: 600;">
            Página actual: <span th:text="${currentPage + 1}" style="color: #2c3e50;">1</span>
        </span>
        <div>
            <a class="btn pagination-btn"
               th:classappend="${!hasPrevious} ? 'disabled'"
               th:href="@{/events(page=${currentPage - 1}, city=${selectedCity})}">
                &laquo; Anterior
            </a>
            <a class="btn pagination-btn"
               th:classappend="${!hasNext} ? 'disabled'"
               th:href="@{/events(page=${currentPage + 1}, city=${selectedCity})}">
                Siguiente &raquo;
            </a>
        </div>
    </div>
</div>

</body>
</html>
