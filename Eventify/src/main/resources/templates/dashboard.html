<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Administrativo - Eventify</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        h1 {
            color: #2c3e50;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 10px;
            margin-top: 0;
        }
        .btn-group {
            margin-bottom: 20px;
        }
        .btn {
            display: inline-block;
            background-color: #3498db;
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            transition: background-color 0.2s;
            margin-right: 10px;
        }
        .btn:hover {
            background-color: #2980b9;
        }
        .btn-secondary {
            background-color: #2ecc71;
        }
        .btn-secondary:hover {
            background-color: #27ae60;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }
        th {
            background-color: #f8f9fa;
            color: #2c3e50;
            font-weight: 600;
        }
        tr:hover {
            background-color: #fcfcfc;
        }
        .alert-info {
            background-color: #e8f4fd;
            border-left: 4px solid #3498db;
            color: #2c3e50;
            padding: 15px;
            border-radius: 4px;
            margin-top: 15px;
            font-size: 1.05em;
        }
        .badge {
            background-color: #7f8c8d;
            color: white;
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 0.85em;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Panel de Administración - Eventify</h1>

    <div class="btn-group">
        <a th:href="@{/admin/events/new}" class="btn">➕ Registrar Nuevo Evento</a>
        <a th:href="@{/admin/venues/new}" class="btn btn-secondary">📍 Registrar Nuevo Lugar</a>
    </div>

    <div th:if="${events.isEmpty()}" class="alert-info">
        ℹ️ <strong>Actualmente no hay eventos programados.</strong>
    </div>

    <div th:unless="${events.isEmpty()}">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Nombre del Evento</th>
                <th>Fecha</th>
                <th>Descripción</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="event : ${events}">
                <td><span class="badge" th:text="${event.id}">1</span></td>
                <td th:text="${event.name}" style="font-weight: 600; color: #2c3e50;">Concierto de Arcangel</td>
                <td th:text="${event.date}">15/05/2026</td>
                <td th:text="${event.description}">Increíble concierto de Arcangel con invitados especiales</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
