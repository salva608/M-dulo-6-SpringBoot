<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Evento - Eventify</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 30px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        h1 {
            color: #2c3e50;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 10px;
            margin-top: 0;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #34495e;
        }
        input[type="text"], input[type="date"], textarea, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 1em;
        }
        input[type="text"]:focus, input[type="date"]:focus, textarea:focus, select:focus {
            border-color: #3498db;
            outline: none;
            box-shadow: 0 0 5px rgba(52,152,219,0.3);
        }
        textarea {
            resize: vertical;
            height: 100px;
        }
        /* Contenedor estético para los checkboxes */
        .checkbox-container {
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 15px;
            background-color: #fefefe;
            max-height: 160px;
            overflow-y: auto;
        }
        .checkbox-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            cursor: pointer;
        }
        .checkbox-item input {
            margin-right: 10px;
            transform: scale(1.2);
            cursor: pointer;
        }
        .btn-group {
            margin-top: 25px;
        }
        .btn {
            background-color: #2ecc71;
            color: white;
            padding: 11px 20px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 1em;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #27ae60;
        }
        .btn-cancel {
            background-color: #95a5a6;
            text-decoration: none;
            display: inline-block;
            padding: 11px 20px;
            border-radius: 4px;
            color: white;
            font-weight: bold;
            margin-left: 10px;
        }
        .btn-cancel:hover {
            background-color: #7f8c8d;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Registrar Nuevo Evento</h1>

    <form th:action="@{/events}" th:object="${event}" method="post">

        <div class="form-group">
            <label for="name">Nombre del Evento:</label>
            <input type="text" id="name" th:field="*{name}" placeholder="Ej. Concierto de Arcangel" required maxlength="100"/>
        </div>

        <div class="form-group">
            <label for="date">Fecha del Evento:</label>
            <input type="date" id="date" th:field="*{date}" required/>
        </div>

        <div class="form-group">
            <label for="description">Descripción:</label>
            <textarea id="description" th:field="*{description}" placeholder="Escribe detalles significativos del evento aquí..." required maxlength="500"></textarea>
        </div>

        <div class="form-group">
            <label for="venue" style="color: #2980b9;">Sede Asignada (Obligatoria):</label>
            <select id="venue" th:field="*{venue}" required>
                <option value="" disabled selected>-- Seleccione el Lugar --</option>
                <option th:each="v : ${venues}"
                        th:value="${v.id}"
                        th:text="${v.name + ' (' + v.city + ')'}"></option>
            </select>
        </div>

        <div class="form-group">
            <label style="color: #2980b9;">Categorías del Evento:</label>
            <div class="checkbox-container">
                <div th:each="cat : ${categories}" class="checkbox-item">
                    <input type="checkbox"
                           th:value="${cat.id}"
                           th:field="*{categories}"
                           th:id="${'cat-' + cat.id}">
                    <label th:for="${'cat-' + cat.id}" th:text="${cat.name}" style="font-weight: normal; display: inline; margin: 0; cursor: pointer;"></label>
                </div>
                <div th:if="${#lists.isEmpty(categories)}" style="color: #7f8c8d; font-size: 0.9em;">No hay categorías en el sistema.</div>
            </div>
        </div>

        <div class="btn-group">
            <button type="submit" class="btn">💾 Guardar Registro</button>
            <a th:href="@{/events}" class="btn-cancel">Cancelar</a>
        </div>
    </form>
</div>

</body>
</html>
