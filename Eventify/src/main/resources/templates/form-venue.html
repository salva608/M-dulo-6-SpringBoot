<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Lugar - Eventify</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 30px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        h1 {
            color: #2c3e50;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 10px;
            margin-top: 0;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #34495e;
        }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 1em;
        }
        input[type="text"]:focus, input[type="number"]:focus {
            border-color: #2ecc71;
            outline: none;
            box-shadow: 0 0 5px rgba(46,204,113,0.3);
        }
        .btn-group {
            margin-top: 25px;
        }
        .btn {
            background-color: #2ecc71;
            color: white;
            padding: 11px 20px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 1em;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #27ae60;
        }
        .btn-cancel {
            background-color: #95a5a6;
            text-decoration: none;
            display: inline-block;
            padding: 11px 20px;
            border-radius: 4px;
            color: white;
            font-weight: bold;
            margin-left: 10px;
        }
        .btn-cancel:hover {
            background-color: #7f8c8d;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Registrar Nuevo Lugar (Venue)</h1>

    <form th:action="@{/admin/venues/save}" th:object="${venue}" method="post">

        <div class="form-group">
            <label for="name">Nombre del Lugar:</label>
            <input type="text" id="name" th:field="*{name}" placeholder="Ej. Centro de Eventos Riwi" required/>
        </div>

        <div class="form-group">
            <label for="address">Dirección Física:</label>
            <input type="text" id="address" th:field="*{address}" placeholder="Ej. Calle 45 #12-34" required/>
        </div>

        <div class="form-group">
            <label for="capacity">Capacidad Máxima (Personas):</label>
            <input type="number" id="capacity" th:field="*{capacity}" placeholder="Ej. 500" min="1" required/>
        </div>

        <div class="btn-group">
            <button type="submit" class="btn">💾 Guardar Lugar</button>
            <a th:href="@{/admin/events}" class="btn-cancel">Cancelar</a>
        </div>
    </form>
</div>

</body>
</html>
